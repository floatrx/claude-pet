[package]
name = "claude-pet"
version = "0.1.0"
description = "Desktop mascot for Claude Code"
authors = ["floatrx"]
edition = "2021"

[lib]
name = "claude_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
dirs = "6"
